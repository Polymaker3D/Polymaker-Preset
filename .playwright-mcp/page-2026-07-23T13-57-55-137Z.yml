      - generic [ref=e27]:
        - generic [ref=e28]:
          - button "BambuStudio Preset Import Mismatch - Fixed" [ref=e29] [cursor=pointer]:
            - generic [ref=e31]: ▼
          - generic [ref=e32]:
            - paragraph [ref=e33]:
              - strong [ref=e34]: "Issue:"
              - text: BambuStudio matches filament presets to printers by checking whether the full printer preset name (e.g. "Bambu Lab X1 Carbon 0.4 nozzle") appears inside the preset's
              - code [ref=e35]: name
              - text: field. Polymaker source files use the abbreviation
              - code [ref=e36]: "@BBL X1"
              - text: ", so the substring check fails and AMS slot temperature / type do not populate when assigning the imported filament."
            - paragraph [ref=e37]:
              - strong [ref=e38]: "Solution:"
              - text: This website now automatically splits BambuStudio downloads into per-printer files and rewrites the
              - code [ref=e39]: name
              - text: field to contain the full printer preset name. Download presets using the
              - strong [ref=e40]: JSON
              - text: or
              - strong [ref=e41]: .bbsflmt
              - text: buttons on this page — do not copy raw JSON files directly from GitHub.
            - paragraph [ref=e42]:
              - 'link "View GitHub Issue #14 →" [ref=e43] [cursor=pointer]':
                - /url: https://github.com/Polymaker3D/Polymaker-Preset/issues/14
        - generic [ref=e44]:
          - button "P2S Overheating Issue - Temporary Fix Applied" [ref=e45] [cursor=pointer]:
            - generic [ref=e47]: ▼
          - generic [ref=e48]:
            - paragraph [ref=e49]:
              - strong [ref=e50]: "Issue:"
              - text: P2S printer may overheat when printing materials with vitrification temperature > 50°C due to starting G-code issues.
            - paragraph [ref=e51]:
              - strong [ref=e52]: "Solution:"
              - text: We have implemented a temporary fix by adding cooling G-code commands to P2S presets with vitrification temperature > 50°C. This is a temporary workaround until Bambu Lab fixes this issue.
            - paragraph [ref=e53]: Thanks to alexbreinig and capsel22 for identifying this issue.
        - generic [ref=e54]:
          - button "BambuStudio Restart Required After Import" [ref=e55] [cursor=pointer]:
            - generic [ref=e57]: ▼
          - generic [ref=e58]:
            - paragraph [ref=e59]:
              - strong [ref=e60]: "Issue:"
              - text: BambuStudio may not correctly apply newly imported filament presets until the application is restarted. Slicing or printing without restarting may use incorrect temperature, flow rate, or other filament settings.
            - paragraph [ref=e61]:
              - strong [ref=e62]: "Solution:"
              - text: Always restart BambuStudio after importing Polymaker presets, before you start slicing or printing. A warning popup will also remind you when downloading BambuStudio presets from this page.
            - paragraph [ref=e63]:
              - 'link "View BambuStudio Issue #10583 →" [ref=e64] [cursor=pointer]':
                - /url: https://github.com/bambulab/BambuStudio/issues/10583
